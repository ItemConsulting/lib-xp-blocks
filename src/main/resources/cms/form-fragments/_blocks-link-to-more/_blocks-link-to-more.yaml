kind: "FormFragment"
title:
  text: "Link to more"
  i18n: "form-fragments._blocks-link-to-more.displayName"
description:
  text: "A reference to content where the user can read more about the subject"
  i18n: "form-fragments._blocks-link-to-more.description"
form:
  - type: "ContentSelector"
    name: "linkToMoreContentId"
    label:
      text: "Link to content"
      i18n: "form-fragments._blocks-link-to-more.linkToMoreContentId"
    helpText:
      text: "Show the user a link to a page where they can see a more complete list or read more about a topic."
      i18n: "form-fragments._blocks-link-to-more.linkToMoreContentId.helpText"
    occurrences:
      min: 0
      max: 1

  - type: "TextLine"
    name: "linkToMoreText"
    label:
      text: "Bottom link text"
      i18n: "form-fragments._blocks-link-to-more.linkToMoreText"
    helpText:
      text: "The link text must, on its own and without help from the surrounding text, say where the link goes (WCAG 2.4.9). For example \"Download the annual report 2025\" or \"Read the latest news\"."
      i18n: "form-fragments._blocks-link-to-more.linkToMoreText.helpText"
    occurrences:
      min: 0
      max: 1
