kind: "FormFragment"
title:
  text: "Text"
  i18n: "form-fragments.blocks-text.displayName"
description:
  text: "Rich text field that can contain lists and tables"
  i18n: "form-fragments.blocks-text.description"
form:
  - type: "TextLine"
    name: "title"
    label:
      text: "Title"
      i18n: "form-fragments.blocks-text.title"
    occurrences:
      min: 0
      max: 1

  - type: "HtmlArea"
    name: "text"
    label:
      text: "Text"
      i18n: "form-fragments.blocks-text.text"
    occurrences:
      min: 0
      max: 1
    exclude: "*"
    include: "Format Bold RemoveFormat | BulletedList NumberedList | Link Unlink | SpecialChar Macro"
    allowHeadings: "h3"
