# yaml-language-server: $schema=https://www.schemastore.org/enonic-xp-form-fragment-8.0.0.json
kind: "FormFragment"
title:
  text: "Reuse"
  i18n: "form-fragments.blocks-reuse.displayName"
description:
  text: "Reuse all blocks inside another content, or show a fragment"
  i18n: "form-fragments.blocks-reuse.description"
form:
  - type: "ContentSelector"
    name: "contentId"
    label:
      text: "Content to reuse"
      i18n: "form-fragments.blocks-reuse.contentId"
    helpText:
      text: "The visitor sees all the blocks of this content at this place on the page, and later changes to the content show up here too. Select a fragment to show it as it is."
      i18n: "form-fragments.blocks-reuse.contentId.helpText"
    occurrences:
      min: 1
      max: 1
