# yaml-language-server: $schema=https://www.schemastore.org/enonic-xp-form-fragment-8.0.0.json
kind: "FormFragment"
title:
  text: "Highlighted text"
  i18n: "form-fragments.blocks-text-highlighted.displayName"
description:
  text: "A box containing text that can have different background colours"
  i18n: "form-fragments.blocks-text-highlighted.description"
form:
  - type: "TextLine"
    name: "title"
    label:
      text: "Title"
      i18n: "form-fragments.blocks-text-highlighted.title"
    occurrences:
      min: 0
      max: 1

  - type: "HtmlArea"
    name: "text"
    label:
      text: "Text"
      i18n: "form-fragments.blocks-text-highlighted.text"
    occurrences:
      min: 0
      max: 1
    exclude: "*"
    include: "PasteModeSwitcher | Format Bold RemoveFormat | BulletedList NumberedList | Link Unlink | SpecialChar Macro"
    allowHeadings: "h3"
