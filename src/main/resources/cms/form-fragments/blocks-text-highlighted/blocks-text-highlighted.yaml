kind: "FormFragment"
title:
  text: "Highlighted text"
  i18n: "form-fragments.blocks-text-highlighted.displayName"
description:
  text: "A box containing text that can have different background colors"
  i18n: "form-fragments.blocks-text-highlighted.description"
form:
  - type: "TextLine"
    name: "title"
    label:
      text: "Title"
      i18n: "form-fragments.blocks-text-highlighted.title"
    occurrences:
      min: 0
      max: 1

  - type: "HtmlArea"
    name: "text"
    label:
      text: "Text"
      i18n: "form-fragments.blocks-text-highlighted.text"
    occurrences:
      min: 1
      max: 1
    exclude: "*"
    include: "Format | Bold Italic RemoveFormat | BulletedList NumberedList | Subscript Superscript Blockquote | SpecialChar Link Unlink Table Image Macro"
    allowHeadings: "h3"
