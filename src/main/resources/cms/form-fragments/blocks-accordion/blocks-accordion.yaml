# yaml-language-server: $schema=https://www.schemastore.org/enonic-xp-form-fragment-8.0.0.json
kind: "FormFragment"
title:
  text: "Accordion"
  i18n: "form-fragments.blocks-accordion.displayName"
description:
  text: "A list of expandable sections"
  i18n: "form-fragments.blocks-accordion.description"
form:
  - type: "ItemSet"
    name: "items"
    label:
      text: "Accordion element"
      i18n: "form-fragments.blocks-accordion.items"
    occurrences:
      min: 1
      max: 0
    items:
      - type: "TextLine"
        name: "title"
        label:
          text: "Title"
          i18n: "form-fragments.blocks-accordion.items.title"
        occurrences:
          min: 1
          max: 1
      - type: "HtmlArea"
        name: "text"
        label:
          text: "Text"
          i18n: "form-fragments.blocks-accordion.items.text"
        occurrences:
          min: 1
          max: 1
        exclude: "*"
        include: "PasteModeSwitcher | Format Bold RemoveFormat | BulletedList NumberedList | Link Unlink | SpecialChar Macro"
        allowHeadings: "h3"
