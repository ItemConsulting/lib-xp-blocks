kind: "FormFragment"
title:
  text: "Images"
  i18n: "form-fragments.blocks-images.displayName"
description:
  text: "An image gallery or an image that can be expanded"
  i18n: "form-fragments.blocks-images.description"
form:
  - type: "ItemSet"
    name: "items"
    label:
      text: "Image"
      i18n: "form-fragments.blocks-images.items"
    occurrences:
      min: 1
      max: 0
    items:
      - type: "ImageSelector"
        name: "imageId"
        label:
          text: "Image"
          i18n: "form-fragments.blocks-images.items.imageId"
        occurrences:
          min: 1
          max: 1
      - type: "TextLine"
        name: "altText"
        label:
          text: "Description of the image (alt text)"
          i18n: "form-fragments.blocks-images.items.altText"
        helpText:
          text: "Describe the image – in the context of the article – so that users with visual impairments get an experience equivalent to that of sighted users (WCAG 1.1.1)."
          i18n: "form-fragments.blocks-images.items.altText.helpText"
        occurrences:
          min: 1
          max: 1
      - type: "TextArea"
        name: "caption"
        label:
          text: "Caption"
          i18n: "form-fragments.blocks-images.items.caption"
        occurrences:
          min: 0
          max: 1
