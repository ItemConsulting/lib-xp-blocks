kind: "FormFragment"
title:
  text: "Intro"
  i18n: "form-fragments._blocks-intro.displayName"
description:
  text: "A reusable intro section that can be included before the main block content"
  i18n: "form-fragments._blocks-intro.description"
form:
  - type: "TextLine"
    name: "title"
    label:
      text: "Title"
      i18n: "form-fragments._blocks-intro.title"
    occurrences:
      min: 0
      max: 1

  - type: "HtmlArea"
    name: "text"
    label:
      text: "Text"
      i18n: "form-fragments._blocks-intro.text"
    occurrences:
      min: 0
      max: 1
    exclude: "*"
    include: "Format Bold RemoveFormat | BulletedList NumberedList | Link Unlink | SpecialChar Macro"
    allowHeadings: "h3"
