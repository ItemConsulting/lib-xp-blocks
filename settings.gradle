pluginManagement {
  repositories {
    gradlePluginPortal()
    // Snapshots of Item's own plugins, such as no.item.xp.codegen
    maven {
      url = "https://repo.itemtest.no/snapshots"
      mavenContent {
        snapshotsOnly()
      }
      content {
        includeGroupByRegex "no\\.item(\\..*)?"
      }
    }
  }
}

plugins {
  id 'com.enonic.xp.settings' version '4.2.0'
}

rootProject.name = projectName
