plugins {
  id "java-library"
  id "maven-publish"
  id "com.enonic.xp.base"
  id "no.item.xp.codegen" version "3.0.0-SNAPSHOT"
  id "com.github.node-gradle.node" version "7.1.0"
}

dependencies {
  // ─────────────────────────────────────────────────────────────────────────
  // Libraries the blocks call at runtime (versions in gradle/libs.versions.toml). They are published as runtime
  // dependencies of the jar, and a consumer's `include` is transitive, so consuming apps get them without listing them.
  // ─────────────────────────────────────────────────────────────────────────
  implementation libs.asset
  implementation libs.freemarker
  implementation xplibs.content
  implementation xplibs.i18n
  implementation xplibs.portal
}

repositories {
  mavenLocal()
  mavenCentral()
  xp.enonicRepo()
  maven { url = "https://repo.itemtest.no/releases" }
}

node {
  download = true
  // Single source of truth for the Node version, shared with .github/workflows and nvm
  version = file(".nvmrc").text.trim()
}

// npmBuild writes the compiled scripts and styles here, and processResources copies them into the jar's resources
def npmOutputDir = layout.buildDirectory.dir("npm")

processResources {
  from(npmOutputDir)
  dependsOn "npmBuild"

  // Copy doesn't remove files that are no longer produced (e.g. a deleted or renamed source file), so start from an
  // empty directory; everything in it comes from this task
  doFirst {
    delete destinationDir
  }

  exclude "**/.gitkeep"
  exclude "**/*.json"
  exclude "**/*.ts"
  exclude "**/*.tsx"

  // The block styles are shipped bundled as assets/styles/blocks-all.min.css by npmBuild (PostCSS), so their sources are
  // left out: the stylesheets in assets/styles/ and the ones next to the form fragments (cms/form-fragments/<name>/).
  // The excludes also apply to npmBuild's output, so the bundle (*.min.css) is kept.
  exclude { FileTreeElement file ->
    file.path.startsWith("assets/styles/") && file.name.endsWith(".css") && !file.name.endsWith(".min.css")
  }
  exclude "cms/**/*.css"
}

tasks.register("npmBuild", NpmTask) {
  args = [
    "run",
    "--silent",
    "build"
  ]
  dependsOn npmInstall, generateTypeScript
  environment = [
    "FORCE_COLOR": "true",
    "LOG_LEVEL_FROM_GRADLE": gradle.startParameter.logLevel.toString(),
    "NODE_ENV": isDevBuild() ? "development" : "production"
  ]
  inputs.dir "src/main/resources"
  outputs.dir npmOutputDir
  outputs.upToDateWhen { false }
}

// Accepts -Penv=dev as well as the older -Pdev / -Pdevelopment spellings.
// The legacy flags have to be read straight off the command line: Gradle exposes tasks as project properties, so
// project.hasProperty("dev") is always true once the "dev" task below exists, which made every build a dev build.
boolean isDevBuild() {
  Map<String, String> cliProperties = gradle.startParameter.projectProperties

  return project.findProperty("env") == "dev" ||
    cliProperties.containsKey("dev") ||
    cliProperties.containsKey("development")
}

tasks.register("dev", Exec) {
  if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
    commandLine "cmd", "/c", "gradlew.bat", "deploy", "-t"
  } else {
    commandLine "./gradlew", "deploy", "-t"
  }
}

tasks.register("npmCheck", NpmTask) {
  dependsOn npmInstall, generateTypeScript
  args = [
    "run",
    "check"
  ]
  environment = [
    "FORCE_COLOR": "true",
  ]
}

check.dependsOn npmCheck

tasks.withType(Copy).configureEach {
  includeEmptyDirs = false
}

// A changesets prerelease (`npx changeset pre enter beta`) is recorded in .changeset/pre.json as `"mode": "pre"`, and
// its versions (1.0.0-beta.0) do not end in -SNAPSHOT. They still belong in the snapshots repository, so the releases
// repository only ever holds stable versions. `npx changeset pre exit` flips the mode to "exit", and the
// `changeset version` that follows bumps to the stable version and deletes the file.
boolean isChangesetPrerelease() {
  File preState = file(".changeset/pre.json")

  return preState.exists() && new groovy.json.JsonSlurper().parse(preState).mode == "pre"
}

publishing {
  repositories {
    maven {
      name = "itemtestRepository"
      url = version.endsWith("SNAPSHOT") || isChangesetPrerelease()
        ? "https://repo.itemtest.no/snapshots"
        : "https://repo.itemtest.no/releases"
      credentials(PasswordCredentials)
      authentication {
        basic(BasicAuthentication)
      }
    }
  }
  publications {
    maven(MavenPublication) {
      from components.java
      // project.* qualified: inside a MavenPublication closure a bare "version" would
      // resolve to the publication's own property, not the project's.
      groupId = project.group
      artifactId = projectName
      version = project.version
    }
  }
}
